name: Build 3D Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g obj2gltf gltf-pipeline @gltf-transform/cli

      - name: Convert OBJ → GLB + Simplify + Draco
        run: |
          set -e
          converted=0

          for zone in */; do
            [[ "$zone" == ".github/" ]] && continue
            [[ "$zone" == "node_modules/" ]] && continue

            src="${zone}src"
            dist="${zone}dist"

            [ -d "$src" ] || continue
            mkdir -p "$dist"

            for obj in "$src"/*.obj; do
              [ -f "$obj" ] || continue

              name=$(basename "$obj" .obj)
              out="$dist/${name}.glb"
              tmp="$dist/${name}_tmp.glb"

              echo "▶ Convirtiendo: $obj"

              # Paso 1: OBJ → GLB
              obj2gltf -i "$obj" -o "$out" --checkTransparency
              echo "  GLB base:    $(du -sh "$out" | cut -f1)"

              # Paso 2: Weld — une vértices duplicados y genera índices
              # OBLIGATORIO antes de simplify; los OBJ no siempre tienen índices
              gltf-transform weld "$out" "$tmp"
              mv "$tmp" "$out"
              echo "  Weld:        $(du -sh "$out" | cut -f1)"

              # Paso 3: Simplificación de malla
              # --ratio 0.30 → conserva 30% de triángulos (ajustar si se ve mal)
              # --error 0.001 → tolerancia geométrica baja (más fiel a original)
              gltf-transform simplify "$out" "$tmp" \
                --ratio 0.30 \
                --error 0.001
              mv "$tmp" "$out"
              echo "  Simplificado: $(du -sh "$out" | cut -f1)"

              # Paso 4: Draco sobre malla ya simplificada
              gltf-pipeline \
                -i "$out" \
                -o "$out" \
                --draco.compressionLevel 7 \
                --draco.quantizePositionBits 14 \
                --draco.quantizeNormalBits 10 \
                --draco.quantizeTexcoordBits 12

              echo "  ✔ Final+Draco: $(du -sh "$out" | cut -f1)"
              converted=$((converted + 1))
            done
          done

          echo ""
          echo "Total convertidos: $converted modelo(s)"

      - name: Verificar GLB válidos
        run: |
          errors=0
          for zone in */; do
            [[ "$zone" == ".github/" ]] && continue
            dist="${zone}dist"
            [ -d "$dist" ] || continue
            for glb in "$dist"/*.glb; do
              [ -f "$glb" ] || continue
              magic=$(xxd -p -l 4 "$glb")
              if [ "$magic" != "676c5446" ]; then
                echo "❌ Corrupto: $glb"
                errors=$((errors + 1))
              else
                echo "✔ OK: $glb"
              fi
            done
          done
          [ $errors -eq 0 ] || exit 1

      - name: Commit resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*/dist/*.glb"
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
            exit 0
          fi
          git commit -m "chore: build GLB + weld + simplify + Draco"
          git push
