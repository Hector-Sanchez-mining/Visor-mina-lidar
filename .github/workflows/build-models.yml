name: Build 3D Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm install -g obj2gltf
          npm install -g @gltf-transform/cli

      - name: Install KTX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libktx-tools

      - name: Convert + Optimize models
        run: |
          set -e

          for zone in */; do
            if [ -d "${zone}src" ]; then
              mkdir -p "${zone}dist"

              for obj in "${zone}"src/*.obj; do
                [ -f "$obj" ] || continue

                name=$(basename "$obj" .obj)

                echo "→ OBJ → GLB"
                obj2gltf -i "$obj" -o "${zone}dist/${name}.glb"

                echo "→ Draco"
                npx @gltf-transform/cli draco \
                  "${zone}dist/${name}.glb" \
                  "${zone}dist/${name}.glb"

                echo "→ Texturas KTX2"
                npx @gltf-transform/cli etc1s \
                  "${zone}dist/${name}.glb" \
                  "${zone}dist/${name}.glb"
              done
            fi
          done

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if ls */dist/*.glb 1> /dev/null 2>&1; then
            git add */dist/*.glb
            git commit -m "Auto: build optimized GLB models"
            git push
          else
            echo "No GLB files found, skipping commit"
          fi
