name: Build 3D Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install -g obj2gltf gltf-pipeline

      - name: Convert OBJ → GLB + Draco
        run: |
          set -e
          converted=0

          for zone in */; do
            # Ignorar carpetas del sistema
            [[ "$zone" == ".github/" ]] && continue
            [[ "$zone" == "node_modules/" ]] && continue

            src="${zone}src"
            dist="${zone}dist"

            [ -d "$src" ] || continue
            mkdir -p "$dist"

            for obj in "$src"/*.obj; do
              [ -f "$obj" ] || continue

              name=$(basename "$obj" .obj)
              out="$dist/${name}.glb"

              echo "▶ Convirtiendo: $obj"

              # Paso 1: OBJ → GLB (con texturas embebidas)
              obj2gltf \
                -i "$obj" \
                -o "$out" \
                --checkTransparency

              echo "  ✔ GLB generado: $out ($(du -sh "$out" | cut -f1))"

              # Paso 2: Aplicar compresión Draco a la geometría
              gltf-pipeline \
                -i "$out" \
                -o "$out" \
                --draco.compressionLevel 7 \
                --draco.quantizePositionBits 14 \
                --draco.quantizeNormalBits 10 \
                --draco.quantizeTexcoordBits 12

              echo "  ✔ Draco aplicado: $out ($(du -sh "$out" | cut -f1))"
              converted=$((converted + 1))
            done
          done

          echo ""
          echo "Total convertidos: $converted modelo(s)"

      - name: Verificar GLB válidos
        run: |
          errors=0
          for zone in */; do
            [[ "$zone" == ".github/" ]] && continue
            dist="${zone}dist"
            [ -d "$dist" ] || continue
            for glb in "$dist"/*.glb; do
              [ -f "$glb" ] || continue
              magic=$(xxd -p -l 4 "$glb")
              if [ "$magic" != "676c5446" ]; then
                echo "❌ Corrupto: $glb"
                errors=$((errors + 1))
              else
                echo "✔ OK: $glb"
              fi
            done
          done
          [ $errors -eq 0 ] || exit 1

      - name: Commit resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*/dist/*.glb"
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
            exit 0
          fi
          git commit -m "chore: build GLB + Draco"
          git push
