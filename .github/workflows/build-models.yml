name: Build 3D Models (GLB + Draco)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install -g obj2gltf
          npm install -g @gltf-transform/cli

      - name: Convert + Draco
        run: |
          set -e

          for zone in */; do
            if [ -d "${zone}src" ]; then
              mkdir -p "${zone}dist"

              for obj in "${zone}"src/*.obj; do
                [ -f "$obj" ] || continue

                name=$(basename "$obj" .obj)

                obj2gltf -i "$obj" -o "${zone}dist/${name}.glb"

                npx @gltf-transform/cli draco \
                  "${zone}dist/${name}.glb" \
                  "${zone}dist/${name}.glb"
              done
            fi
          done

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "GLB + Draco build"
          git push
