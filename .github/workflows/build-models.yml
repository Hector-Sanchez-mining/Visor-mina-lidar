name: Build 3D Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install obj2gltf
        run: npm install -g obj2gltf

      - name: Convert models
        run: |
          set -e

          for zone in */; do
            echo "Revisando zona: $zone"

            if [ -d "${zone}src" ]; then
              echo "→ Tiene carpeta src"

              mkdir -p "${zone}dist"

              echo "Contenido de ${zone}src:"
              ls -la "${zone}src"

              for obj in "${zone}"src/*.obj; do
                if [ ! -f "$obj" ]; then
                  echo "No hay .obj en ${zone}src"
                  continue
                fi

                name=$(basename "$obj" .obj)

                echo "Procesando: $obj"

                obj2gltf -i "$obj" -o "${zone}dist/${name}.glb"
              done
            else
              echo "No existe ${zone}src"
            fi
          done

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if ls */dist/*.glb 1> /dev/null 2>&1; then
            git add */dist/*.glb
            git commit -m "Auto: build GLB models"
            git push
          else
            echo "No GLB files found, skipping commit"
          fi
