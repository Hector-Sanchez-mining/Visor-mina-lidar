name: Compress Textures (WebP)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build 3D Models"]   # debe coincidir con el name: del otro workflow
    types: [completed]

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gltf-transform CLI
        run: npm install -g @gltf-transform/cli

      - name: Compress textures to WebP
        run: |
          set -e
          compressed=0

          for zone in */; do
            [[ "$zone" == ".github/" ]] && continue
            [[ "$zone" == "node_modules/" ]] && continue

            dist="${zone}dist"
            [ -d "$dist" ] || continue

            for glb in "$dist"/*.glb; do
              [ -f "$glb" ] || continue

              size_before=$(du -sh "$glb" | cut -f1)
              echo "▶ Comprimiendo: $glb (antes: $size_before)"

              gltf-transform webp "$glb" "$glb" \
                --quality 80 \
                --verbose

              size_after=$(du -sh "$glb" | cut -f1)
              echo "  ✔ Listo: $glb (después: $size_after)"
              compressed=$((compressed + 1))
            done
          done

          echo "Total procesados: $compressed archivo(s)"

      - name: Verificar GLB válidos
        run: |
          errors=0
          for zone in */; do
            [[ "$zone" == ".github/" ]] && continue
            dist="${zone}dist"
            [ -d "$dist" ] || continue
            for glb in "$dist"/*.glb; do
              [ -f "$glb" ] || continue
              magic=$(xxd -p -l 4 "$glb")
              if [ "$magic" != "676c5446" ]; then
                echo "❌ Corrupto: $glb"
                errors=$((errors + 1))
              else
                echo "✔ OK: $glb"
              fi
            done
          done
          [ $errors -eq 0 ] || exit 1

      - name: Commit resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*/dist/*.glb"
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
            exit 0
          fi
          git commit -m "chore: WebP texture compression"
          git push
