name: Compress Textures (KTX2)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build 3D Models"]   # debe coincidir exactamente con el name: del otro workflow
    types: [completed]

permissions:
  contents: write

jobs:
  ktx:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── PASO 1: instalar KTX-Software (toktx) desde GitHub Releases ──────────
      # IMPORTANTE: el archivo es .tar.bz2 (no .tar.gz) y la versión es 4.4.2
      - name: Install KTX-Software (toktx)
        run: |
          KTX_VERSION="4.4.2"
          FILE="KTX-Software-${KTX_VERSION}-Linux-x86_64.tar.bz2"
          URL="https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_VERSION}/${FILE}"

          echo "▶ Descargando KTX-Software v${KTX_VERSION}..."
          curl -fL "$URL" -o "$FILE"

          echo "Tamaño descargado: $(du -sh "$FILE" | cut -f1)"

          # Descomprimir .tar.bz2
          tar -xjf "$FILE"

          # Mover toktx al PATH
          sudo cp "KTX-Software-${KTX_VERSION}-Linux-x86_64/bin/toktx" /usr/local/bin/
          sudo chmod +x /usr/local/bin/toktx

          # Verificar instalación
          echo "✔ toktx instalado:"
          toktx --version

      # ── PASO 2: instalar gltf-transform CLI ──────────────────────────────────
      - name: Install gltf-transform CLI
        run: npm install -g @gltf-transform/cli

      # ── PASO 3: comprimir texturas ───────────────────────────────────────────
      - name: Compress textures to KTX2 (ETC1S)
        run: |
          set -e
          compressed=0

          for zone in */; do
            [[ "$zone" == ".github/" ]] && continue
            [[ "$zone" == "node_modules/" ]] && continue

            dist="${zone}dist"
            [ -d "$dist" ] || continue

            for glb in "$dist"/*.glb; do
              [ -f "$glb" ] || continue

              size_before=$(du -sh "$glb" | cut -f1)
              echo "▶ Comprimiendo: $glb (antes: $size_before)"

              gltf-transform etc1s "$glb" "$glb" \
                --quality 128 \
                --verbose

              size_after=$(du -sh "$glb" | cut -f1)
              echo "  ✔ Listo: $glb (después: $size_after)"
              compressed=$((compressed + 1))
            done
          done

          echo "Total procesados: $compressed archivo(s)"

      # ── PASO 4: verificar integridad ─────────────────────────────────────────
      - name: Verificar GLB válidos
        run: |
          errors=0
          for zone in */; do
            [[ "$zone" == ".github/" ]] && continue
            dist="${zone}dist"
            [ -d "$dist" ] || continue
            for glb in "$dist"/*.glb; do
              [ -f "$glb" ] || continue
              magic=$(xxd -p -l 4 "$glb")
              if [ "$magic" != "676c5446" ]; then
                echo "❌ Corrupto: $glb"
                errors=$((errors + 1))
              else
                echo "✔ OK: $glb"
              fi
            done
          done
          [ $errors -eq 0 ] || exit 1

      # ── PASO 5: commit ───────────────────────────────────────────────────────
      - name: Commit resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*/dist/*.glb"
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
            exit 0
          fi
          git commit -m "chore: KTX2 (ETC1S) texture compression"
          git push
