name: Compress Textures (KTX2 Stable)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ktx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install -g @gltf-transform/cli

      - name: KTX2 compression
        run: |
          set -e

          for zone in */; do
            if [ -d "${zone}dist" ]; then

              for glb in "${zone}"dist/*.glb; do
                [ -f "$glb" ] || continue

                echo "Processing: $glb"

                npx @gltf-transform/cli optimize \
                  "$glb" \
                  "$glb" \
                  --compress draco \
                  --texture-compress ktx2

              done
            fi
          done

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "KTX2 texture compression (final)"
          git push
